# Browser-side widgets for things Foster markup can't express (WebGL
# simulations). Each widget crate builds to a standalone wasm-bindgen ES
# module that Foster lazy-loads via `fx-widget` when it scrolls into view —
# see build.sh and the `fx-widget` attributes in foster-server/static/index.html.
[workspace]
members = ["common", "life", "pathfinding", "satellites"]
resolver = "2"

[workspace.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
widget-common = { path = "common" }

# Shipped to visitors: size over speed (the hot loops are on the GPU).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
